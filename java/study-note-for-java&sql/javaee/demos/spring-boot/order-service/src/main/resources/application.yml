spring:
  application:
    name: order-service

  # SQLite 数据源
  # WAL：读写并行；busy_timeout：写锁冲突时最多等待 5 秒而不是立刻失败
  # （两者缺一不可，高并发下的关键参数——详见教程第 12 章"踩坑记录"）
  datasource:
    url: jdbc:sqlite:data/order.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC

  # SQLite 不属于 Spring Boot 识别范围内的嵌入式数据库，需显式开启 SQL 初始化
  sql:
    init:
      mode: always

server:
  port: 8081

logging:
  level:
    # 打印 JdbcTemplate 真实执行的 SQL（教学演示用，生产可关掉）
    org.springframework.jdbc.core: DEBUG
